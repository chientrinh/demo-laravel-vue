server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html index.htm;
    server_name localhost;

    # Serve static files
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|ttf|woff|woff2|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API proxy - forward /api/ requests to Laravel backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Increase timeout for file uploads
        proxy_request_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # SPA history mode routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}