name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend job
  backend:
    name: Backend: Lint & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taskflow
          MYSQL_USER: taskflow
          MYSQL_PASSWORD: taskflow_password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
        sysctls:
          - net.core.somaxconn=65535
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: [pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, xsl]
          ini-values: memory_limit=256M

      - name: 📦 Install dependencies
        run: cd backend && composer install --no-interaction --optimize-autoloader --no-dev

      - name: 🧪 Run linters
        run: cd backend && php vendor/bin/phpcs --standard=phpcs.xml.dist app/ routes/ --error-severity=0 2>/dev/null || echo "Code style check"

      - name: 📋 Run PHP unit tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: taskflow
          DB_USERNAME: taskflow
          DB_PASSWORD: taskflow_password
        run: cd backend && php vendor/bin/phpunit --no-coverage

      - name: 📤 Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/

  # Frontend job
  frontend:
    name: Frontend: Lint & Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: cd frontend && npm ci

      - name: 🧪 Run ESLint
        run: cd frontend && npm run lint

      - name: 🏗️ Build frontend
        run: cd frontend && npm run build

      - name: 📤 Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # Deploy job
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-deploy

      - name: 📥 Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-deploy

      - name: 🚀 Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment steps here
          # - rsync to server
          # - trigger deployment script
          # - etc.