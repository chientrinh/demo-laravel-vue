version: '3.8'

services:
  # Backend (Laravel 11 + PHP 8.3 + Apache)
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=taskflow
      - DB_USERNAME=taskflow
      - DB_PASSWORD=taskflow_password
    volumes:
      - ../backend/:/var/www/html
      - ./backend/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql

  # Database (MySQL 8)
  mysql:
    build:
      context: database
      dockerfile: Dockerfile
    container_name: taskflow-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=taskflow
      - MYSQL_USER=taskflow
      - MYSQL_PASSWORD=taskflow_password
    volumes:
      - mysql_data:/var/lib/mysql

# Frontend (Vue 3 SPA via Nginx)
  frontend:
    image: nginx:alpine
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_USE_MOCK=false
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data: