services:
  # Backend (Laravel 11 + PHP 8.3 + Apache) — source & vendor are baked into the image
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_NAME=TaskFlow
      - APP_ENV=local
      - "APP_KEY=base64:pvSvOxcHz5Lmh+DoboSgP93K1pq40DH1Hnd8RifcpRU="
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=taskflow
      - DB_USERNAME=taskflow
      - DB_PASSWORD=taskflow_password
      - SESSION_DRIVER=database
      - SESSION_SECURE_COOKIE=false
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - LOG_CHANNEL=stack
      - FRONTEND_URL=http://localhost:3000
      - SANCTUM_STATEFUL_DOMAINS=localhost:3000,localhost:80,localhost:8080,127.0.0.1:3000,127.0.0.1:80,127.0.0.1:8080
    depends_on:
      mysql:
        condition: service_healthy

  # Database (MySQL 8)
  mysql:
    build:
      context: database
      dockerfile: Dockerfile
    container_name: taskflow-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=taskflow
      - MYSQL_USER=taskflow
      - MYSQL_PASSWORD=taskflow_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskflow", "-ptaskflow_password"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Frontend (Vue 3 SPA via Nginx) — build `frontend/` and copy dist into docker/frontend/dist
  frontend:
    image: nginx:alpine
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_USE_MOCK=false
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
